[package]
name = "lama-inpaint"
version = "0.2.1"
edition = "2021"
description = "Standalone big-lama inpainting inference engine (GPU with CPU fallback)"

[[bin]]
name = "lama-inpaint"
path = "src/main.rs"

[dependencies]
png = "0.17"
rayon = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
